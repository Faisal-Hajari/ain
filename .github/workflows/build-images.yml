name: build-images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Serialize main builds so an older commit can never finish last and leave
# :latest pointing at it. Do not cancel: every commit still gets its :sha tag.
concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  discover:
    name: discover apps
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.scan.outputs.matrix }}
      registry_repo: ${{ steps.scan.outputs.registry_repo }}
    steps:
      - uses: actions/checkout@v4

      - id: scan
        name: find applications with a Dockerfile
        run: |
          set -euo pipefail
          shopt -s nullglob

          apps=()
          skipped=()
          for dir in applications/*/; do
            name=${dir#applications/}
            name=${name%/}
            if [[ -f "${dir}Dockerfile" ]]; then
              apps+=("$name")
            else
              skipped+=("$name")
            fi
          done

          for name in ${skipped[@]+"${skipped[@]}"}; do
            echo "::warning::applications/$name has no Dockerfile - not built or published"
          done

          # An empty matrix would skip the build job and report a green run that
          # published nothing. Fail instead: "nothing to build" is not success.
          if [[ ${#apps[@]} -eq 0 ]]; then
            echo "::error::no applications/*/Dockerfile found - nothing to build"
            exit 1
          fi

          matrix=$(printf '%s\n' "${apps[@]}" \
            | jq -R -s -c '[splits("\n") | select(length > 0) | {dir: ., image: ascii_downcase}]')

          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          # ghcr.io rejects uppercase; the owner here is "Faisal-Hajari".
          echo "registry_repo=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

          {
            echo "### Images to build"
            printf -- '- %s\n' "${apps[@]}"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: build ${{ matrix.dir }}
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: applications/${{ matrix.dir }}
          file: applications/${{ matrix.dir }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ needs.discover.outputs.registry_repo }}/${{ matrix.image }}:latest
            ghcr.io/${{ needs.discover.outputs.registry_repo }}/${{ matrix.image }}:${{ github.sha }}
          # Links the package to this repo so it inherits repo visibility.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
