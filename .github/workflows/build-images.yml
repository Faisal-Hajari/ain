name: build-images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Serialize main builds so an older commit can never finish last and leave
# :latest pointing at it. Do not cancel: every commit still gets its :sha tag.
concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every application that ships a Dockerfile. A new one is a line here.
        app: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ghcr.io rejects uppercase and the owner here is "Faisal-Hajari", so the
      # repository slug has to be lowercased before it can be part of a tag.
      # GitHub expressions have no lowercase function; the shell does.
      - name: lowercase the registry repository
        run: echo "REGISTRY_REPO=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/build-push-action@v6
        with:
          context: applications/${{ matrix.app }}
          file: applications/${{ matrix.app }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REGISTRY_REPO }}/${{ matrix.app }}:latest
            ghcr.io/${{ env.REGISTRY_REPO }}/${{ matrix.app }}:${{ github.sha }}
          # Links the package to this repo so it inherits repo visibility.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
