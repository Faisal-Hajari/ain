name: test

on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

# A rapid push sequence on a PR should not queue several full matrices; only the
# newest commit's result is worth anything. Mirrors build-images.yml, but
# cancelling is safe here: these runs publish nothing.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend on py${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is the floor the backend declares in its requires-python; 3.13 is
        # the newest release it is expected to work on. Running both catches a
        # dependency that only resolves on one of them.
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # The backend's test dependencies are a PEP 735 dependency-group, which
      # uv installs by default; --all-extras also picks up any optional extra
      # added later without editing this step.
      - name: pytest
        working-directory: applications/backend
        run: uv run --python ${{ matrix.python }} --all-extras pytest -q

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: applications/frontend/package-lock.json

      # npm ci installs exactly the lockfile, so a green run here means the
      # committed lockfile is the one that was tested.
      - name: npm ci
        working-directory: applications/frontend
        run: npm ci

      # Types, tests and lint are separate steps so a failure names itself in
      # the job log rather than hiding behind one merged command.
      - name: typecheck
        working-directory: applications/frontend
        run: npm run typecheck

      - name: test
        working-directory: applications/frontend
        run: npm run test

      - name: lint
        working-directory: applications/frontend
        run: npm run lint
