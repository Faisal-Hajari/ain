[project]
name = "ain-analytics"
version = "0.1.0"
description = "cameras.yml and the ClickHouse connection, shared by the three analytics services"
requires-python = ">=3.10"
# Deliberately small. This is what MORE THAN ONE service needs: the geometry
# loader that all three read, and the ClickHouse client the API and the
# ingest both write through. Everything a single service needs lives with
# that service - a shared library that grows whatever its first caller wanted
# is how three services end up unable to move independently.
dependencies = [
    "clickhouse-connect>=0.8.0",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Writing cameras.yml back, which only the API does. ruamel is here rather
# than in the base because the ingest and sink images are built on the Savant
# adapters base and pip-install their dependencies over a CUDA-built OpenCV:
# every package not added there is one that cannot break it.
write = [
    "ruamel-yaml>=0.18",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = [".", "../../scripts"]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ain_analytics"]
