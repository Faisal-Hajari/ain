# GENERATED by `uv run scripts/compose_gen.py` from config/cameras.yml.
# Do not edit: run the generator. `--check` fails when this is out of date.
#
# One Savant source adapter per camera. They read RTSP from MediaMTX rather
# than the mp4 files directly - reading the files would be cheaper and would
# make browser overlays permanently impossible, because Savant and MediaMTX
# would each loop the same recording independently and drift apart within
# minutes. Both have to watch the same decoded stream.

services:
  savant-source-03:
    image: ghcr.io/insight-platform/savant-adapters-gstreamer@sha256:bc0d9fc73999ee7411183b783df53335af1bebb7161b981f0b175dfc3a3d1d47
    entrypoint:
    - /bin/sh
    - -c
    - python3 /wait_for_stream.py; exec /opt/savant/adapters/gst/sources/rtsp.sh
    volumes:
    - ./scripts/wait_for_stream.py:/wait_for_stream.py:ro
    environment:
      RTSP_URI: 'rtsp://cameras:8554/cam3'
      RTSP_TRANSPORT: 'tcp'
      SOURCE_ID: '03'
      AIN_WAIT_FOR_PATH: 'cam3'
      ZMQ_ENDPOINT: 'dealer+connect:tcp://savant-module:5555'
      USE_ABSOLUTE_TIMESTAMPS: 'True'
      STALL_ACTION: 'fail'
      LOGLEVEL: 'info'
    depends_on:
      savant-module:
        condition: service_healthy
      cameras:
        condition: service_healthy
    restart: unless-stopped
