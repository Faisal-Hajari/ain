# The whole stack: the dashboard, the API it talks to, and one RTSP camera
# per recording in videos/cctv.
#
#   docker compose up --build
#
# The dashboard is then on http://localhost:3000 and each camera on
# rtsp://localhost:86NN/camNN (use -rtsp_transport tcp; RTP over UDP goes out
# from ports that are not published).

# Every camera differs only in its file, its path and its published port, so
# the rest is written once here. Only cam3 carries the `build`: ten services
# building the same context into the same tag race in BuildKit and the export
# fails. Compose finishes every build before it starts a container, so by the
# time these are created the tag is on the machine - `never` keeps compose from
# looking for it in a registry it was never pushed to.
x-rtsp-camera: &rtsp-camera
  image: ain-rtsp-video-streaming:dev
  pull_policy: never
  restart: unless-stopped

services:
  backend:
    build: ./applications/backend
    image: ain-backend:dev
    ports:
      - "8000:8000"
    environment:
      # nginx proxies /api from the same origin, so the browser never makes a
      # cross-origin call; these are for hitting the API from a dev server.
      AIN_CORS_ORIGINS: "http://localhost:5173,http://localhost:3000"
    restart: unless-stopped

  frontend:
    build: ./applications/frontend
    image: ain-frontend:dev
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  # Each camera loops its own recording forever. The folder mounted at /videos
  # holds a single file, so the loop is that one recording; RTSP_PATH is read by
  # both the server and the image's health check, which keeps the two in step.
  cam3:
    <<: *rtsp-camera
    # The one build; every other camera runs the image it produces.
    build: ./applications/rtsp-video-streaming
    environment:
      RTSP_PATH: cam3
    ports:
      - "8603:8554"
    volumes:
      - ./videos/cctv/cam3_2026-07-27_21-57-55.mp4:/videos/cam3.mp4:ro

  cam4:
    <<: *rtsp-camera
    environment:
      RTSP_PATH: cam4
    ports:
      - "8604:8554"
    volumes:
      - ./videos/cctv/cam4_2026-07-27_22-58-12.mp4:/videos/cam4.mp4:ro

  cam5:
    <<: *rtsp-camera
    environment:
      RTSP_PATH: cam5
    ports:
      - "8605:8554"
    volumes:
      - ./videos/cctv/cam5_2026-07-27_19-55-22.mp4:/videos/cam5.mp4:ro

  cam6:
