[project]
name = "ain-analytics"
version = "0.1.0"
description = "Detection ingest and the KPI query layer over ClickHouse"
readme = "README.md"
requires-python = ">=3.10"
# Shared by both entrypoints. Everything else is an extra, because the two
# run on different bases: the ingest consumer has to be built on the Savant
# adapters image, which is where savant-rs comes from - the Kafka payload is
# a savant-rs binary blob and the two ends must agree on its format, and that
# wheel is not published on PyPI.
dependencies = [
    "clickhouse-connect>=0.8.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    # Clips are drawn on the CPU. headless: no GUI libraries in the image.
    "opencv-python-headless>=4.10",
    "numpy>=1.26",
    "ruamel-yaml>=0.18",
]
ingest = [
    "confluent-kafka>=2.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
