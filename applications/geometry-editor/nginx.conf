# One page and a reverse proxy, which is the whole service.
#
# The editor is static: no build step, no bundler, no server-side rendering.
# What it does need is to be on the SAME ORIGIN as the API it reads and
# writes, because it fetches with relative paths - `fetch("zones")`,
# `fetch("frame?camera=03")`. Proxying those through here means the page has
# no idea where the API is, no CORS preflight on the save, and no hostname
# baked into the HTML at build time.
server {
    listen 8101;
    server_name _;

    root /usr/share/nginx/html;
    index editor.html;

    # The page itself is bind-mounted, so it changes without the image
    # changing. Cached, an edit to it appears to do nothing at all - which
    # cost two rounds of testing a file the browser was not running.
    location = / {
        try_files /editor.html =404;
        add_header Cache-Control "no-store" always;
    }

    # Everything the page asks the API for. Named one at a time rather than
    # proxying `/`, so this cannot become an accidental open relay to the
    # analytics service.
    location ~ ^/(zones|cameras|frame|health)$ {
        proxy_pass http://analytics-api:8100;
        proxy_set_header Host $host;
        # A still is cut with ffmpeg over RTSP and can take a few seconds;
        # a save parses and rewrites cameras.yml. Neither is instant, and
        # nginx's 60s default would cut a slow camera off mid-frame.
        proxy_read_timeout 90s;
    }
}
