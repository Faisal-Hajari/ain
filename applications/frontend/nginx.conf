server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Client-side routing: unknown paths fall back to the SPA shell.
  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    proxy_pass http://backend:8000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # The camera tiles play from this same origin, so no CORS and no host is
  # baked into a payload. The prefix is the stream server's own - /cam3/, not
  # /cameras/cam3/ - because nothing then has to be rewritten: its redirects
  # and its player's relative asset URLs are already right. Order matters
  # twice over: nginx takes the first matching regex, so this has to precede
  # the asset rule below or the player's own .js is served from the SPA root.
  location ~ ^/cam[0-9]+/ {
    proxy_pass http://cameras:8888;
    proxy_set_header Host $host;
    # HLS segments are written as they are encoded; buffering them adds
    # latency for nothing.
    proxy_buffering off;
  }

  location ~* \.(js|css|woff2?|png|svg)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }
}
